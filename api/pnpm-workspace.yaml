allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  esbuild: false
  prisma: true
  unrs-resolver: false
# Security (GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3, GHSA-ggr8-5vv4-36mx): transitive deps of the
# Prisma CLI. Remove once Prisma itself requires the patched versions.
overrides:
  mysql2: '>=3.23.1'
  deepmerge-ts: '>=8.0.0'
