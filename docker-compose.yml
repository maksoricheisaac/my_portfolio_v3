# Dokploy stack: web (Next.js) -> api (NestJS) -> db (PostgreSQL).
#
# TLS and routing are handled by Dokploy's Traefik: no reverse proxy here and no published ports.
# In Dokploy: create a "Docker Compose" service on this repo, then in the Domains tab map your
# domain to service `web`, port `3000`, HTTPS on (Let's Encrypt). Set the variables from
# env/.env.<env>.example in the Environment tab. See docs/DOKPLOY.md.
#
# The same file serves every environment (production / staging / development): only the variables
# differ. COMPOSE_PROFILES=mailcatcher adds Mailpit (dev/staging), COMPOSE_PROFILES=backup adds
# nightly database dumps.
name: portfolio

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Hops in front of the API: Traefik -> Next.js (/backend proxy) -> API.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio?schema=public
      WEB_ORIGINS: ${SITE_URL:?set SITE_URL}
      SITE_URL: ${SITE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      WEB_REVALIDATE_URL: http://web:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      OTP_SECRET: ${OTP_SECRET:?set OTP_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      CONTACT_TO: ${CONTACT_TO:-}
      UPLOAD_DIR: /app/uploads
      # First run: the setup wizard at /admin/setup creates the owner account. The one-time setup
      # token is printed in the api logs (or fixed here with SETUP_TOKEN).
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Non-interactive alternative: when ADMIN_PASSWORD is set, the account is created at startup.
      # It stays visible in the container environment: remove it from Dokploy once the account
      # exists (the seed is idempotent and never overwrites an existing account).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads:/app/uploads
    # `app` has outbound access (SMTP); the database lives on the isolated `data` network.
    networks: [data, app]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
        NEXT_PUBLIC_SITE_ENV: ${SITE_ENV:-production}
        # Baked into the /backend rewrite at build time.
        API_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_SITE_ENV: ${SITE_ENV:-production}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL}
      # Reverse proxies in front of Next.js that append to X-Forwarded-For (Traefik = 1). Used to
      # derive the real visitor IP for rate limiting; do not raise it above the real number.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    expose: ["3000"]
    # dokploy-network is how Traefik reaches the site. No host port is published.
    networks: [app, dokploy-network]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  # dev / staging: catches every outgoing mail (OTP codes, contact notifications).
  # Enable with COMPOSE_PROFILES=mailcatcher, then add a Dokploy domain on service `mailpit`,
  # port 8025. The UI is protected by MAILPIT_AUTH (user:password).
  mailpit:
    profiles: [mailcatcher]
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      # Required "user:password". Never reuse a security secret (OTP_SECRET, JWT...) here.
      MP_UI_AUTH: ${MAILPIT_AUTH:?set MAILPIT_AUTH (user:password) to use the mailcatcher profile}
    expose: ["8025"]
    networks: [app, dokploy-network]

  # Optional: nightly PostgreSQL dumps. Enable with COMPOSE_PROFILES=backup.
  backup:
    profiles: [backup]
    image: prodrigestivill/postgres-backup-local:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
    volumes:
      - db_backups:/backups
    networks: [data]

networks:
  # Isolated: db <-> api (+ backups) only.
  data:
    internal: true
  # api <-> web. Not published; api needs egress for SMTP.
  app: {}
  # Created and owned by Dokploy (Traefik lives on it).
  dokploy-network:
    external: true

volumes:
  pgdata:
  uploads:
  db_backups:
