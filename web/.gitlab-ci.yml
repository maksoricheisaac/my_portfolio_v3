# Verification pipeline only: no automatic production deployment.
image: node:24-alpine

stages:
  - verify
  - security
  - build

default:
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

lint:
  stage: verify
  script: [pnpm lint]

typecheck:
  stage: verify
  script: [pnpm typecheck]

# SCA: fails the pipeline on a high/critical advisory in production dependencies.
dependency-audit:
  stage: security
  script: [pnpm audit --prod --audit-level=high]

# Secret scan of the repository history (see .gitleaks.toml at the root for allowlists).
secret-scan:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.18.4
    entrypoint: [""]
  before_script: []
  cache: {}
  script: [gitleaks detect --source . --redact --no-banner --verbose]

build:
  stage: build
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
  script: [pnpm build]
