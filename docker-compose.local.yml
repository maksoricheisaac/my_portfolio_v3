# LOCAL: only the backing services run in Docker; api and web run natively (pnpm start:dev / pnpm dev).
#   docker compose -f docker-compose.local.yml up -d
#   - PostgreSQL on 127.0.0.1:5433
#   - Mailpit (fake SMTP, catches OTP codes and contact mails): SMTP 127.0.0.1:1025, UI http://localhost:8025
name: portfolio-local

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata_local:
